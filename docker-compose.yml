services:
  demo-api:
    build:
      context: .
      dockerfile: demo/Dockerfile
    container_name: load-tester-demo-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 30s
      retries: 3